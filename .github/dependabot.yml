---
version: 2

# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
# check-jsonschema --schemafile https://json.schemastore.org/dependabot-2.0.json .github/dependabot.yml

# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
# https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configuring-multi-ecosystem-updates
#
# Goal: bundle updates from ALL ecosystems into a SINGLE pull request.
#
# How it works:
# - The group `infrastructure` owns the schedule and the PR-level settings
#   (labels, commit-message, open-pull-requests-limit, target-branch).
# - Each `updates` entry only declares its ecosystem, directory/directories,
#   `patterns` (REQUIRED when using multi-ecosystem-group), and the
#   `multi-ecosystem-group` name. Per-ecosystem `schedule` and `labels` are
#   intentionally omitted: the group drives scheduling and PR metadata, so
#   duplicating them per-ecosystem is redundant and can conflict.
multi-ecosystem-groups:
  infrastructure:
    schedule:
      # interval: "weekly"
      interval: "daily"
    labels: ["infrastructure", "dependencies"]
    open-pull-requests-limit: 3
    target-branch: "main"
    commit-message:
      prefix: "dbot/fix"
      prefix-development: "dbot/chore"
      include: "scope" # Append (deps) or (deps-dev) to prefix

updates:
  - package-ecosystem: "pip"
    directory: "/python"
    multi-ecosystem-group: "infrastructure"
    patterns:
      - "*"

  - package-ecosystem: "terraform"
    directories:
      - "/terraform"
    multi-ecosystem-group: "infrastructure"
    patterns:
      - "*"

  - package-ecosystem: "npm"
    directories:
      - "/devplatform/devplatform"
      - "/devplatform/sam-pipeline"
    multi-ecosystem-group: "infrastructure"
    patterns:
      - "*"

  - package-ecosystem: "github-actions"
    directory: "/.github"
    multi-ecosystem-group: "infrastructure"
    patterns:
      - "*"
