    #       - "patch"

  - package-ecosystem: npm
    directories:
      - "/devplatform/devplatform"
      - "/devplatform/sam-pipeline"
    schedule:
      interval: "daily"
    # commit-message:
    #   prefix: "dbot/fix"
    #   prefix-development: "dbot/chore"
    #   include: "scope" # Append (deps) or (deps-dev) to prefix
    labels:
      - "dependencies"
      - "npm"
    # multi-ecosystem-group: "infrastructure"
    # patterns:
    #   - "*"
    groups:
      npm:
        patterns:
          - '*'

  - package-ecosystem: "github-actions"
    directory: "/.github"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "github-actions"
    multi-ecosystem-group: "infrastructure"
    patterns:
      - "*"
