          # grouped: false


  - package-ecosystem: "terraform"
    directories:
      - "/terraform"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "terraform"
    multi-ecosystem-group: "infrastructure"
    patterns:
      - "*"
