    # commit-message:
    #   prefix: "dbot/fix"
    #   prefix-development: "dbot/chore"
    #   include: "scope" # Append (deps) or (deps-dev) to prefix
    labels:
      - "dependencies"
      - "terraform"
    multi-ecosystem-group: "infrastructure"
    patterns:
      - "*"
    # groups:
    #   tf-version:
    #     applies-to: version-updates
    #     patterns:
    #       - "*"
    #     update-types:
    #       - "minor"
    #       - "patch"
    #   tf-security:
