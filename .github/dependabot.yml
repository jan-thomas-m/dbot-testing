---
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    target-branch: "main"
    labels:
      - "dependencies"
      - "python"
    # groups:
    #   minor-and-patch:
    #     applies-to: version-updates
    #     patterns:
    #       - "*"
    #     update-types:
    #       # - "major"
    #       - "minor"
    #       - "patch"
    # ignore:
    #     - dependency-name: "*"
    #       update-types:
    #         - "version-update:semver-major"
          # grouped: false


  - package-ecosystem: "terraform"
    directories:
      - "/terraform"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    target-branch: main
    labels:
      - "dependencies"
      - "terraform"
    groups:
      tf-version:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      tf-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    target-branch: "main"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      gha-version:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      gha-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
